<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<!--
  NANO VOICE OVERLAY

  A quiet status capsule that appears bottom-centre while Nano is listening
  and disappears when it is done. It is NOT a window the user interacts with:
  it is click-through, never takes focus, and has no controls.

  Design: the NANO language of the main window, scaled down — charcoal
  glass, the approved N symbol, one hairline of blue, and motion that says
  which phase the turn is in without shouting. It has to sit on top of a game
  or a document, so every animation is small, slow, and stops the moment the
  overlay hides.

  HONEST MOTION. The bars in the visualiser are a LOOP, not a meter. The
  backend does not send audio amplitude to this window, so nothing here can
  claim to show your voice level; the wave is decorative and deliberately
  regular, which is what a loop looks like and what a level meter does not.
  Every STATE, by contrast, comes from a real backend voice event (see
  lib/overlay-state.js). This file never advances a state on its own.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
<title>Nano</title>
<style>
  /* Tokens mirrored from frontend/styles/globals.css. The overlay is a
     separate Electron window with its own CSP and cannot import that file, so
     the few values it needs are restated here — and only those. */
  :root {
    --accent:     #2F6FED;
    --accent-hot: #8EB5FF;
    --danger: #F49BB4;
    --surface:    rgba(19, 24, 32, .97);
    --border:     rgba(192, 211, 239, .27);
    --hairline:   rgba(224, 236, 255, 0.12);
    --text:       #F4F7FC;
    --text-dim:   #C7D0DD;
    --quiet:      #AEB9C8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  #panel {
    position: absolute; inset: 8px 10px;
    display: flex; align-items: center; gap: 12px;
    padding: 0 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    /* One shadow, one hairline border, nothing else. The overlay stays a dark
       floating panel in both themes — it is drawn over whatever the user is
       doing, so it never adopts the workspace's cream. Its identity comes from
       the mark and blue state line. */
    box-shadow: 0 9px 24px -8px rgba(0, 0, 0, .55), 0 2px 7px rgba(0, 0, 0, .2);
    backdrop-filter: none;
    opacity: 0;
    transform: translateY(7px);
    transition: opacity 160ms ease, transform 190ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  #panel[data-visible="true"] { opacity: 1; transform: translateY(0); }

  /* ── The mark and its state ring ───────────────────────────────────── */
  #orb { position: relative; width: 36px; height: 36px; flex: none; display: grid; place-items: center; }

  /* The disc the mark sits on, matching .mark-disc in the shell. */
  #disc {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 50% 30%, rgba(90, 153, 255, .20), rgba(47, 111, 237, .06) 70%);
    border: 1px solid rgba(142, 181, 255, .3);
  }

  /* No ambient glow; the status label and stateful indicator carry feedback. */
  #halo { display: none; }

  /* A single arc that orbits the mark while a request is being worked on.
     One arc with a gap, not a full ring: a closed ring reads as a progress
     circle, and there is no progress to report. */
  #ring {
    position: absolute; inset: -3px; border-radius: 50%;
    border: 1.5px solid transparent;
    border-top-color: var(--accent-hot);
    border-right-color: rgba(142, 181, 255, .3);
    opacity: 0;
    transition: opacity 200ms ease;
  }

  #mark { width: 21px; height: 21px; object-fit: contain; position: relative; }

  /* ── Text ──────────────────────────────────────────────────────────── */
  #text { flex: 1; min-width: 0; }
  #label {
    font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
    color: var(--text); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  #detail {
    font-size: 11px; color: var(--text-dim); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #detail:empty { display: none; }

  /* ── The visualiser ────────────────────────────────────────────────── */
  #viz {
    display: flex; align-items: center; gap: 4px;
    height: 22px; flex: none; opacity: 0;
    transition: opacity 180ms ease;
  }
  #viz i {
    display: block; width: 3px; height: 4px; border-radius: 2px;
    background: var(--accent-hot);
    box-shadow: none;
    transform-origin: center;
  }

  /* ── Progress rail ─────────────────────────────────────────────────── */
  #rail {
    position: absolute; left: 70px; right: 64px; bottom: 5px;
    height: 2px; border-radius: 2px;
    background: var(--hairline);
    overflow: hidden; opacity: 0;
    transition: opacity 160ms ease;
  }
  #rail i {
    display: block; width: 32%; height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--accent-hot), transparent);
    transform: translateX(-100%);
  }

  /* ══ STATE: LISTENING ═══════════════════════════════════════════════
     A slow blue breath plus a live wave. This is the only state where the
     microphone is genuinely open, so it is the loudest of the six. */
  #panel[data-state="activated"] #viz,
  #panel[data-state="listening"] #viz { opacity: 1; }
  #panel[data-state="activated"] #viz i,
  #panel[data-state="listening"] #viz i {
    animation-name: wave; animation-duration: 1100ms;
    animation-timing-function: ease-in-out; animation-iteration-count: infinite;
  }

  /* ══ STATE: TRANSCRIBING ════════════════════════════════════════════
     The microphone is closed and Whisper is working. Quieter by design: the
     same five marks, but pulsing in sequence as dots rather than rising as
     bars — nothing is being heard any more. */
  #panel[data-state="transcribing"] #viz { opacity: 0.75; }
  #panel[data-state="transcribing"] #viz i {
    height: 4px; width: 4px; border-radius: 50%;
    background: var(--accent-hot);
    animation-name: blip; animation-duration: 1300ms;
    animation-timing-function: ease-in-out; animation-iteration-count: infinite;
  }

  /* ══ STATE: PROCESSING ══════════════════════════════════════════════
     The model is thinking. The arc orbits the mark and the rail travels. */
  #panel[data-state="processing"] #ring { opacity: 1; animation: orbit 1500ms linear infinite; }
  #panel[data-state="processing"] #rail { opacity: 1; }
  #panel[data-state="processing"] #rail i { animation: travel 1400ms ease-in-out infinite; }

  /* ══ STATE: SPEAKING ════════════════════════════════════════════════
     Nano is talking. A smooth symmetric wave — see the note at the top of this
     file: it is a loop, not a level meter, because no amplitude is sent here. */
  #panel[data-state="speaking"] #viz { opacity: 1; }
  #panel[data-state="speaking"] #viz i {
    animation-name: speak; animation-duration: 900ms;
    animation-timing-function: ease-in-out; animation-iteration-count: infinite;
  }

  /* ══ STATE: BUSY ════════════════════════════════════════════════════
     A second activation arrived while a turn was already running. Nothing new
     is happening, so the only motion is a slow rail. */
  #panel[data-state="busy"] #rail { opacity: 1; }
  #panel[data-state="busy"] #rail i {
    background: linear-gradient(90deg, transparent, var(--quiet), transparent);
    animation: travel 2100ms ease-in-out infinite;
  }
  #panel[data-state="busy"] #disc,
  #panel[data-state="quiet"] #disc { border-color: rgba(224, 236, 255, 0.10); background: rgba(224, 236, 255, 0.04); }
  #panel[data-state="busy"] #mark,
  #panel[data-state="quiet"] #mark { opacity: 0.65; }
  #panel[data-state="busy"] #label,
  #panel[data-state="quiet"] #label { color: var(--text-dim); }

  /* ══ STATE: ERROR ═══════════════════════════════════════════════════
     Red, and no more than that. Something did not work; the overlay is not
     the place to make a scene about it. */
  #panel[data-state="error"] { border-color: var(--danger); }
  #panel[data-state="error"] #label { color: var(--danger); }

  /* ══ STATE: DONE ════════════════════════════════════════════════════
     A brief acknowledgement on the way out. */
  #panel[data-state="done"] #mark { animation: flare 620ms ease-out 1; }

  @keyframes breathe {
    0%, 100% { opacity: 0.12; transform: scale(0.88); }
    50%      { opacity: 0.34; transform: scale(1.08); }
  }
  @keyframes orbit { to { transform: rotate(360deg); } }
  @keyframes travel {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(340%); }
  }
  /* The bars share one keyframe and are separated by delay, so the wave reads
     as a single travelling shape instead of five independent blinks. */
  @keyframes wave {
    0%, 100% { height: 4px;  opacity: 0.55; }
    50%      { height: 18px; opacity: 1; }
  }
  @keyframes speak {
    0%, 100% { height: 5px;  opacity: 0.6; }
    50%      { height: 14px; opacity: 1; }
  }
  @keyframes blip {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 1; }
  }
  /* One brief accent acknowledgement at completion. */
  @keyframes flare {
    0%   { filter: drop-shadow(0 0 0 rgba(142, 181, 255, 0)); }
    35%  { filter: drop-shadow(0 0 7px rgba(142, 181, 255, 0.55)); }
    100% { filter: drop-shadow(0 0 0 rgba(142, 181, 255, 0)); }
  }

  /* Delays span roughly half the cycle, so the five bars form one travelling
     shape. They are longhand-only rules for the same reason the state rules
     are: the `animation` shorthand would reset them. */
  #viz i:nth-child(1) { animation-delay: -420ms; }
  #viz i:nth-child(2) { animation-delay: -280ms; }
  #viz i:nth-child(3) { animation-delay: 0ms; }
  #viz i:nth-child(4) { animation-delay: -280ms; }
  #viz i:nth-child(5) { animation-delay: -420ms; }

  /* Nothing animates while hidden: a window nobody can see must not repaint. */
  #panel[data-visible="false"] #ring,
  #panel[data-visible="false"] #viz i,
  #panel[data-visible="false"] #rail i { animation: none !important; }

  @media (prefers-reduced-motion: reduce) {
    #ring, #viz i, #rail i, #mark { animation: none !important; }
    /* The states must still be told apart without motion, so the visualiser
       stays visible at a fixed height and the arc stays parked. */
    #panel[data-state="processing"] #ring { opacity: 1; }
    #viz i { height: 10px; }
    #panel { transition: opacity 120ms linear; transform: none; }
  }
</style>
</head>
<body>
  <div id="panel" data-visible="false" data-state="idle" role="status" aria-live="polite">
    <div id="orb">
      <div id="halo"></div>
      <div id="disc"></div>
      <div id="ring"></div>
      <!-- The approved N, generated from the same master as the app icon by
           scripts/build_app_icon.ps1. Never redrawn here. -->
      <img id="mark" src="nano-mark.png" alt="" aria-hidden="true" draggable="false" />
    </div>

    <div id="text">
      <div id="label">Nano</div>
      <div id="detail"></div>
    </div>

    <div id="viz" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

    <div id="rail" aria-hidden="true"><i></i></div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
