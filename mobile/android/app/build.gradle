apply plugin: 'com.android.application'

// VERSION: one place. versionName follows mobile/package.json; versionCode is
// NANO_VERSION_CODE from CI (the run number), so every build can update the last.
def packageJson = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def nanoVersionCode = (System.getenv('NANO_VERSION_CODE') ?: '1') as Integer

// SIGNING. Two keys, on purpose:
//  * "test" builds are signed with nano-test.keystore, committed here. It is a
//    throwaway key whose only job is to let each new test APK install over the
//    previous one. It is NOT the Play Store key and must never become it.
//  * release builds are signed with the owner's private upload key, which is
//    never in the repository: keystore.properties next to this file (local), or
//    the NANO_UPLOAD_* environment variables (CI secrets). See mobile/README.md.
def keystoreProps = new Properties()
def keystorePropsFile = file('keystore.properties')
if (keystorePropsFile.exists()) { keystorePropsFile.withInputStream { keystoreProps.load(it) } }
def uploadStore = keystoreProps['storeFile'] ?: System.getenv('NANO_UPLOAD_KEYSTORE')

android {
    namespace = "app.nano.assistant"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "app.nano.assistant"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode nanoVersionCode
        versionName packageJson.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Updating itself from GitHub (NanoUpdaterPlugin): only the test APK
        // and debug builds. The Play Store build is updated by Google Play.
        buildConfigField "boolean", "SELF_UPDATE", "false"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        test {
            storeFile file('nano-test.keystore')
            storePassword 'nanotest'
            keyAlias 'nanotest'
            keyPassword 'nanotest'
        }
        if (uploadStore) {
            release {
                storeFile file(uploadStore)
                storePassword keystoreProps['storePassword'] ?: System.getenv('NANO_UPLOAD_STORE_PASSWORD')
                keyAlias keystoreProps['keyAlias'] ?: System.getenv('NANO_UPLOAD_KEY_ALIAS')
                keyPassword keystoreProps['keyPassword'] ?: System.getenv('NANO_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.test
            buildConfigField "boolean", "SELF_UPDATE", "true"
        }
        // The test APK people install by hand: release code, test key.
        preview {
            initWith release
            signingConfig signingConfigs.test
            matchingFallbacks = ['release']
            buildConfigField "boolean", "SELF_UPDATE", "true"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (uploadStore) {
                signingConfig signingConfigs.release
            }
        }
    }
    lint {
        abortOnError false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
