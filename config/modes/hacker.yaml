# Modo Programar — ambiente de desenvolvimento.
# Ver config/modes/foco.yaml para o formato. Terminais e interpretadores
# (wt, powershell, cmd, bash…) são recusados: um modo não os pode abrir.
name: "Modo Programar"
description: "Editor de código, GitHub e documentação; fecha distrações."
message: "Modo Programar ativo. Bom código!"

close_apps:
  - "spotify"
  - "discord"
  - "slack"
  - "whatsapp"

open_apps:
  - "Visual Studio Code"

open_urls:
  - "https://github.com"
  - "https://stackoverflow.com"

volume: 45
settings_section: "notifications"
