# Nano Assistant — Configuração principal
# Não guardar API keys neste ficheiro. Use NANO_API_KEY/GROQ_API_KEY no ambiente
# ou configure-as no onboarding da aplicação.

# ── LLM cloud ──────────────────────────────────────────────────────────────────
# O modelo cloud tem de existir na tua conta Groq. "llama-3.3-70b-versatile"
# foi descontinuado e devolvia 404 em TODAS as mensagens, obrigando sempre ao
# fallback local (e sem resposta nenhuma quando o Ollama tambem estava parado).
#
# Dois niveis. A conversa normal usa sempre o modelo rapido; o modelo forte so
# e escolhido quando o pedido e classificado como COMPLEX (analise, codigo,
# raciocinio), nunca por a mensagem ser comprida.
#
# Escolhidos por benchmark real nesta conta (nao por documentacao):
#   - llama-3.1-8b-instant e llama-3.3-70b-versatile NAO existem nesta conta.
#   - qwen/qwen3.6-27b escreve o raciocinio <think> dentro da resposta e gasta
#     400-700 tokens num simples "Ola".
#   - openai/gpt-oss-20b: 1o token ~344 ms, portugues de Portugal correcto.
groq_model: "openai/gpt-oss-20b"
groq_fast_model: "openai/gpt-oss-20b"
groq_complex_model: "openai/gpt-oss-120b"

# ── LLM local ─────────────────────────────────────────────────────────────────
local:
  enabled: true
  # Modelo local usado pelo Nano. "auto" escolhe pela RAM disponivel; define um
  # nome explicito (ex.: qwen3:8b) para garantir qual e usado. O Nano NUNCA faz
  # fallback silencioso para outro modelo: se este nao estiver instalado, o
  # estado passa a MODEL_UNAVAILABLE e o erro e visivel na UI.
  model: "qwen3:8b"
  url: "http://127.0.0.1:11434"
  auto_download: false          # o Nano nunca faz pull de modelos
  max_context: 4096
  # O Nano arranca o SERVIDOR Ollama se ainda nao estiver a correr (reutiliza a
  # instancia existente se estiver). Nenhum modelo e pre-carregado no arranque.
  autostart: true
  # Tempo que o Ollama mantem um modelo em RAM depois da ultima utilizacao.
  keep_alive: "5m"

# ── Memória persistente ────────────────────────────────────────────────────────
memory:
  history_messages: 20
  max_history_chars: 8000
  # Orcamento REAL do historico, em tokens -- a unidade em que o limite da Groq
  # (8000 tokens por minuto) e contado. Um orcamento em caracteres permitia que
  # UMA mensagem reservasse ~6300 dos 8000 tokens do minuto, e duas mensagens
  # seguidas davam 429. Com 1200 tokens sobra folga confortavel para o prompt
  # de sistema, as ferramentas e a resposta.
  max_history_tokens: 1200
  facts_enabled: true
  rag_enabled: true
  rag_results: 3
  rag_max_chars: 1500

# ── Voz ────────────────────────────────────────────────────────────────────────
voice:
  enabled: true
  local_first: true
  cloud_audio: false
  listen_seconds: 7
  session_timeout_seconds: 30
  # Interruptor geral da voz falada.
  tts_enabled: true
  # Falar a resposta a uma mensagem ESCRITA. Desligado por omissao: escrever no
  # chat e comecar a ouvir a resposta em voz alta era surpreendente e indesejado.
  typed_chat_tts: false
  # Falar a resposta a uma mensagem DITADA (turno de voz). Ligado: se o
  # utilizador falou com o Nano, espera ouvir a resposta.
  voice_reply_tts: true
  tts_provider: "edge"
  elevenlabs_voice_id: "RROBrqjHiRb8zmRgGV11"
  openai_voice: "onyx"
  openai_speed: 1.0
  edge_voice: "pt-PT-DuarteNeural"
  edge_rate: "-5%"
  stt_provider: "auto"
  whisper_model: "tiny"
  whisper_compute_type: "int8"
  whisper_device: "cpu"
  stop_on_silence: true
  silence_threshold: 500
  wake_word:
    # DESLIGADO por omissao. Este e o motor ONNX/Porcupine EXPERIMENTAL, que
    # precisa de um modelo de keyword treinado -- e nunca houve nenhum em
    # models/wakeword/, por isso nunca chegou a arrancar.
    #
    # REGRA DO MICROFONE (nao quebrar): so pode existir UM dono activo do
    # microfone. O core/wake_word.py cria e destroi o PyAudio directamente,
    # sem passar pelo _PORTAUDIO_LOCK partilhado do core/voice.py -- e foi
    # exactamente essa concorrencia que rebentou o processo com um access
    # violation (0xC0000005). Enquanto nao passar pelo lock partilhado, este
    # motor fica desligado. O codigo mantem-se para trabalho futuro.
    #
    # A activacao primaria da V1 passa a ser o atalho global (Ctrl+Shift+Space).
    # A wake phrase por STT ("ei nano") continua disponivel e experimental.
    enabled: false
    provider: "openwakeword"
    phrase: "Nano"
    model_path: ""
    keyword_path: ""
    threshold: 0.7
    cooldown_seconds: 2.0
    backend: "auto"
    framework: "onnx"
    custom_verifier_model_path: ""
  # Simple local wake phrase ("Ei Nano") - spots the phrase in local STT
  # transcripts. No trained model needed; works offline. Independent of the
  # wake_word block above.
  #
  # Em portugues de proposito. O faster-whisper-tiny forcado a portugues nao
  # transcreve o "Hey" ingles de forma fiavel: gravacoes reais de "Hey Nano"
  # voltaram como "Ei, nano!", "Ei, nanos!", "Ei, nao.", "E ai, no." e "NAO!",
  # por isso o matcher nunca disparava. "Ei" e uma interjeicao portuguesa que
  # o modelo reconhece.
  wake_phrase: "ei nano"
  # EXPERIMENTAL, and OFF by default since the desktop migration.
  #
  # The primary way to talk to Nano is now the global Ctrl+Shift+Space
  # shortcut, which is instant, deterministic and costs nothing while idle.
  # This detector is none of those things: it keeps a capture stream open and
  # runs faster-whisper-tiny over every chunk forever, it owns the microphone
  # architecture for the whole session, and tiny is not reliable enough at
  # spotting the phrase to be the activation a user depends on.
  #
  # The implementation is intact and still fully supported -- Settings can turn
  # it back on under "Voz experimental" -- it simply no longer runs unasked.
  wake_phrase_enabled: false
  # Bare "nano" desligado por omissao: causava activacoes falsas.
  wake_phrase_allow_nano_only: false
  wake_phrase_cooldown_seconds: 3.0
  wake_phrase_chunk_seconds: 2.5
  # Tempo de espera por um comando depois do chime antes de cancelar.
  wake_command_timeout_seconds: 7

# ── Funcionalidades opcionais ──────────────────────────────────────────────────
iot:
  webhook_url: ""
  notification_webhook: ""

reminders:
  enabled: true

calendar:
  google_enabled: false

monitor:
  enabled: true
  interval_seconds: 60
  cpu_threshold: 90
  ram_threshold: 90
  disk_threshold: 90
  battery_threshold: 15
  alert_cooldown_minutes: 30

organizer:
  watch_downloads: true
  auto_organize: false
  cache_clean_day: "sunday"

# ── UI ─────────────────────────────────────────────────────────────────────────
# 0 = escolher uma porta livre automaticamente. Evita conflitos com outras apps.
ui:
  port: 0
  width: 1440
  height: 900
  mode: "default"
