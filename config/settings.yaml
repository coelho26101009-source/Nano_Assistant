# Nano Assistant — Configuração principal
# Não guardar API keys neste ficheiro. Use NANO_API_KEY/GROQ_API_KEY no ambiente
# ou configure-as no onboarding da aplicação.

# ── LLM cloud ──────────────────────────────────────────────────────────────────
# O modelo cloud tem de existir na tua conta Groq. "llama-3.3-70b-versatile"
# foi descontinuado e devolvia 404 em TODAS as mensagens, obrigando sempre ao
# fallback local (e sem resposta nenhuma quando o Ollama tambem estava parado).
groq_model: "openai/gpt-oss-20b"

# ── LLM local ─────────────────────────────────────────────────────────────────
local:
  enabled: true
  # Modelo local usado pelo Nano. "auto" escolhe pela RAM disponivel; define um
  # nome explicito (ex.: qwen3:8b) para garantir qual e usado. O Nano NUNCA faz
  # fallback silencioso para outro modelo: se este nao estiver instalado, o
  # estado passa a MODEL_UNAVAILABLE e o erro e visivel na UI.
  model: "qwen3:8b"
  url: "http://127.0.0.1:11434"
  auto_download: false          # o Nano nunca faz pull de modelos
  max_context: 4096
  # O Nano arranca o SERVIDOR Ollama se ainda nao estiver a correr (reutiliza a
  # instancia existente se estiver). Nenhum modelo e pre-carregado no arranque.
  autostart: true
  # Tempo que o Ollama mantem um modelo em RAM depois da ultima utilizacao.
  keep_alive: "5m"

# ── Memória persistente ────────────────────────────────────────────────────────
memory:
  history_messages: 20
  max_history_chars: 8000
  facts_enabled: true
  rag_enabled: true
  rag_results: 3
  rag_max_chars: 1500

# ── Voz ────────────────────────────────────────────────────────────────────────
voice:
  enabled: true
  local_first: true
  cloud_audio: false
  listen_seconds: 7
  session_timeout_seconds: 30
  tts_enabled: true
  tts_provider: "edge"
  elevenlabs_voice_id: "RROBrqjHiRb8zmRgGV11"
  openai_voice: "onyx"
  openai_speed: 1.0
  edge_voice: "pt-PT-DuarteNeural"
  edge_rate: "-5%"
  stt_provider: "auto"
  whisper_model: "tiny"
  whisper_compute_type: "int8"
  whisper_device: "cpu"
  stop_on_silence: true
  silence_threshold: 500
  wake_word:
    enabled: true
    provider: "openwakeword"
    phrase: "Nano"
    model_path: ""
    keyword_path: ""
    threshold: 0.7
    cooldown_seconds: 2.0
    backend: "auto"
    framework: "onnx"
    custom_verifier_model_path: ""
  # Simple local wake phrase ("Hey Nano") — spots the phrase in local STT
  # transcripts. No trained model needed; works offline. Independent of the
  # wake_word block above.
  wake_phrase: "hey nano"
  wake_phrase_enabled: true
  wake_phrase_allow_nano_only: true
  wake_phrase_cooldown_seconds: 3.0
  wake_phrase_chunk_seconds: 2.5

# ── Funcionalidades opcionais ──────────────────────────────────────────────────
iot:
  webhook_url: ""
  notification_webhook: ""

reminders:
  enabled: true

calendar:
  google_enabled: false

monitor:
  enabled: true
  interval_seconds: 60
  cpu_threshold: 90
  ram_threshold: 90
  disk_threshold: 90
  battery_threshold: 15
  alert_cooldown_minutes: 30

organizer:
  watch_downloads: true
  auto_organize: false
  cache_clean_day: "sunday"

# ── UI ─────────────────────────────────────────────────────────────────────────
# 0 = escolher uma porta livre automaticamente. Evita conflitos com outras apps.
ui:
  port: 0
  width: 1440
  height: 900
  mode: "default"
