# H.E.L.I.O.S. V8 — Configuração principal
# Não guardar API keys neste ficheiro. Use HELIOS_API_KEY/GROQ_API_KEY no ambiente
# ou configure-as no onboarding da aplicação.

# ── LLM cloud ──────────────────────────────────────────────────────────────────
groq_model: "llama-3.3-70b-versatile"

# ── LLM local ─────────────────────────────────────────────────────────────────
local:
  enabled: true
  model: "auto"                 # auto | qwen2.5:0.5b-instruct | qwen2.5:1.5b-instruct | qwen2.5:3b
  url: "http://127.0.0.1:11434"
  auto_download: false          # ativado pelo onboarding quando o utilizador pedir modo local
  max_context: 4096

# ── Memória persistente ────────────────────────────────────────────────────────
memory:
  history_messages: 20
  max_history_chars: 8000
  facts_enabled: true
  rag_enabled: true
  rag_results: 3
  rag_max_chars: 1500

# ── Voz ────────────────────────────────────────────────────────────────────────
voice:
  tts_enabled: true
  tts_provider: "edge"
  elevenlabs_voice_id: "RROBrqjHiRb8zmRgGV11"
  openai_voice: "onyx"
  openai_speed: 1.0
  edge_voice: "pt-PT-DuarteNeural"
  edge_rate: "-5%"
  stt_provider: "auto"
  whisper_model: "tiny"
  whisper_compute_type: "int8"
  whisper_device: "cpu"
  listen_seconds: 7
  stop_on_silence: true
  silence_threshold: 500
  wake_word_enabled: false
  wake_word_phrase: "hey jarvis"
  wake_word_sensitivity: 0.6
  wake_word_backend: "auto"
  wake_word_framework: "onnx"
  wake_word_cooldown_seconds: 2
  wake_word_keyword_path: ""

# ── Funcionalidades opcionais ──────────────────────────────────────────────────
iot:
  webhook_url: ""
  notification_webhook: ""

reminders:
  enabled: true

calendar:
  google_enabled: false

monitor:
  enabled: true
  interval_seconds: 60
  cpu_threshold: 90
  ram_threshold: 90
  disk_threshold: 90
  battery_threshold: 15
  alert_cooldown_minutes: 30

organizer:
  watch_downloads: true
  auto_organize: false
  cache_clean_day: "sunday"

# ── UI ─────────────────────────────────────────────────────────────────────────
# 0 = escolher uma porta livre automaticamente. Evita conflitos com outras apps.
ui:
  port: 0
  width: 1440
  height: 900
  mode: "default"
