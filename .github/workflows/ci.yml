name: CI

# Fast, cheap, and secret-free. Every check here runs on a fork's pull request
# exactly as it runs on main, because none of it needs a credential: Nano's
# tests never call Groq, never call Ollama, and never touch the real desktop.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege. Nothing in this workflow writes to the repository, so nothing
# in it is granted write. A job that needs more should ask for it locally rather
# than raising the default for everything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- backend
  python:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Deliberately two entries, not a matrix of four. Ubuntu is the fast
        # signal on every push; Windows is where the PC Control and desktop
        # tests stop skipping and actually run. More Python versions would cost
        # minutes to defend a range Nano does not support -- the embedded
        # runtime is pinned to 3.12.
        #
        # Both entries run the SAME command below. The platform split is not
        # done here with a marker expression or a separate job -- it lives in
        # the tests themselves, as a `WINDOWS_ONLY = pytest.mark.skipif(not
        # winapi.IS_WINDOWS, ...)` on each test that genuinely needs real
        # Win32 behaviour (see tests/test_pc_control.py and
        # tests/test_pc_control_v2.py). That keeps this file honest: nothing
        # here silently excludes a security-sensitive test on either
        # platform, and `-ra` below prints exactly what each OS actually
        # skipped and why.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run tests
        # -ra surfaces the skip reasons, which is how a silently-skipped
        # Windows suite gets noticed instead of reading as a pass.
        #
        # `-m "not chromium"` DESELECTS the real-Chromium tests rather than
        # letting them skip here. This job installs no Electron and builds no
        # frontend, so they could only ever skip -- and 57 tests reporting
        # "skipped" in the job most people read as "the tests" is how they
        # stayed unrun for so long. They are deselected here and EXECUTED in
        # the chromium-ui job below, which fails if it cannot run them.
        run: python -m pytest -q -ra -m "not chromium"

      # A different collection order on every run would turn one real
      # order-dependency into an intermittent failure nobody can reproduce, so
      # the seed is PINNED. It is still a different order from the source
      # order, which is the point: core/main.py's module-level singletons are
      # shared by the whole suite, and a test that leaves one altered only
      # fails something else, later, depending on order.
      #
      # Ubuntu only: the question "does any test depend on running after
      # another one" is about Python, not about the platform, and asking it
      # twice would double the cost of this workflow to learn nothing new.
      - name: Run tests in a shuffled order
        if: matrix.os == 'ubuntu-latest'
        run: python -m pytest -q -ra -m "not chromium" --shuffle-seed=20260907

  # --------------------------------------------------------------- frontend
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production build
        working-directory: frontend
        run: npm run build

      # The desktop harnesses (render-check, settings-drive, csp-check) consume
      # this. Keeping it lets the Electron job below reuse it instead of
      # rebuilding, and proves the export really produced something.
      - name: Upload built frontend
        uses: actions/upload-artifact@v7
        with:
          name: frontend-out
          path: frontend/out
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------- desktop shell
  electron:
    name: Electron tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # NODE 22, NOT 20. electron@44 and its install chain (@electron/get,
      # @electron-internal/extract-zip) all declare `engines: node >= 22.12.0`.
      # npm only warns about that, so a Node 20 runner would install and then
      # fail somewhere less obvious.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        working-directory: electron
        run: npm ci

      # electron/test/run.js drives the real preload.js and main.js against a
      # STUBBED Electron, so it needs no display, no GPU and no binary. The
      # harnesses that need real Chromium run in the chromium-ui job below.
      - name: Run Electron shell tests
        working-directory: electron
        run: npm test

  # --------------------------------------------------- the shipped UI, driven
  # The 57 tests that load the PRODUCTION bundle into Electron's own Chromium
  # and measure what a user would see. They ran on one developer's Windows
  # machine and nowhere else, because every module looked for `electron.exe` --
  # a filename that cannot exist on Linux -- so on CI they skipped and the
  # skip read as a pass.
  chromium-ui:
    name: Chromium UI tests
    runs-on: ubuntu-latest
    needs: frontend          # reuses its build instead of repeating it
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # NODE 22, NOT 20. electron@44 and its install chain (@electron/get,
      # @electron-internal/extract-zip) all declare `engines: node >= 22.12.0`.
      # npm only warns about that, so a Node 20 runner would install and then
      # fail somewhere less obvious.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      # The harnesses drive the bundle the frontend job already exported, so
      # the build happens once in this workflow rather than twice.
      - name: Fetch the built frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-out
          path: frontend/out

      - name: Install Electron
        working-directory: electron
        run: npm ci

      # `npm ci` NO LONGER PRODUCES THE BINARY. Electron 42 removed the
      # postinstall script that used to download it (supply-chain hardening;
      # see electron/rfcs#22), so node_modules/electron now arrives without a
      # dist/ and the two steps below -- chowning chrome-sandbox, and every
      # harness -- would fail on a path that does not exist. This is the
      # explicit replacement for that postinstall.
      - name: Fetch the Electron binary
        working-directory: electron
        run: npm run fetch-electron

      # Electron's SUID sandbox helper has to be root-owned and setuid, and an
      # npm-installed copy is neither. Without this the binary refuses to start
      # with "The SUID sandbox helper binary was found, but is not configured
      # correctly" -- and the harnesses genuinely do run their renderers
      # sandboxed (`sandbox: true`), so the answer is to configure it rather
      # than to pass --no-sandbox and quietly test a weaker thing.
      - name: Configure the Chromium sandbox
        working-directory: electron
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Install a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      # THE SCREEN MUST BE AT LEAST 1920x1080. chat-drive.js resizes the window
      # to 1920x1080 and asserts nothing is clipped there; on a smaller virtual
      # screen the window manager clamps the resize and the assertion measures
      # a viewport that was never asked for.
      #
      # NANO_REQUIRE_CHROMIUM=1 turns "the Electron binary is not installed"
      # from a skip into a failure. This job exists to run these tests, so it
      # must not be able to pass without having run them.
      - name: Drive the shipped UI in real Chromium
        env:
          NANO_REQUIRE_CHROMIUM: '1'
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1200x24"
          python -m pytest -q -ra -m chromium --junitxml=chromium-results.xml

      - name: Upload the harness report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-results
          path: chromium-results.xml
          retention-days: 7
          if-no-files-found: ignore

  # ------------------------------------------------------- static security
  security:
    name: Security static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Nano's central invariant is that no model output reaches unrestricted
      # OS execution. This project has shipped a violation of it three times, so
      # the check is a first-class CI job rather than a lint rule someone can
      # skip. It parses the AST -- comments and docstrings that DESCRIBE a
      # removed hazard must not be mistaken for the hazard.
      - name: No shell execution primitives
        run: |
          python - <<'PY'
          import ast, pathlib, sys

          offenders = []
          banned_calls = {"system", "popen"}
          for path in [*pathlib.Path("core").rglob("*.py"),
                       *pathlib.Path("plugins").rglob("*.py")]:
              if "__pycache__" in str(path):
                  continue
              # utf-8-sig: core/voice.py carries a BOM, and plain utf-8
              # would make this gate fail on a SyntaxError rather than
              # on a finding.
              tree = ast.parse(path.read_text(encoding="utf-8-sig"))
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue
                  for kw in node.keywords or []:
                      if (kw.arg == "shell" and isinstance(kw.value, ast.Constant)
                              and kw.value.value is True):
                          offenders.append(f"{path}:{node.lineno}: shell=True")
                  func = node.func
                  if (isinstance(func, ast.Attribute) and func.attr in banned_calls
                          and isinstance(func.value, ast.Name) and func.value.id == "os"):
                      offenders.append(f"{path}:{node.lineno}: os.{func.attr}")
                  if isinstance(func, ast.Name) and func.id in {"eval", "exec"}:
                      offenders.append(f"{path}:{node.lineno}: {func.id}()")

          if offenders:
              print("Forbidden execution primitives found:")
              for line in offenders:
                  print("  " + line)
              sys.exit(1)
          print("No shell=True, os.system, os.popen, eval or exec in core/ or plugins/.")
          PY

      - name: Workflows request no unnecessary write permissions
        run: |
          python - <<'PY'
          import pathlib, sys

          bad = []
          for path in pathlib.Path(".github/workflows").glob("*.y*ml"):
              text = path.read_text(encoding="utf-8")
              if "permissions:" not in text:
                  bad.append(f"{path}: declares no permissions block")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("Every workflow declares an explicit permissions block.")
          PY
