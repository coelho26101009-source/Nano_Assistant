name: Build Nano Windows (manual)

# This workflow produces beta installers for manual validation. Publishing
# requires an explicit input, run either on the tag v<version.json> or on
# main (the release then creates that tag at the commit it was built from;
# cloud sessions cannot push tags). Pushes never publish.
#
# It used to run on every push to main and to publish a GitHub Release on any
# `v*` tag. Neither is appropriate yet:
#
#   * Nano's public releases are Beta pre-releases (0.1.0-beta.1 was the first).
#     Installers are unsigned (Authenticode), and a clean Windows validation
#     remains an open release requirement. Installed apps update themselves
#     from the signed feed the publish job writes (docs/UPDATES.md), so a
#     publish now reaches everyone who installed NANO: one more reason it
#     never happens by accident.
#   * Building an installer on every push spends Windows runner minutes -- the
#     most expensive kind -- to produce something nobody may download.
#   * A release published from a tag is irreversible in practice. Until the
#     release process in docs/RELEASING.md is agreed, nothing should be able to
#     publish by accident.
#
# So the triggers are `workflow_dispatch` only. Ordinary CI lives in ci.yml.
#
# WHAT THE PACKAGING PASS CHANGED HERE. Three things made this workflow unable
# to produce an artifact at all, and none of them could be seen by reading it:
#
#   1. Node 20, while electron@44 and its whole install chain declare
#      `engines: node >= 22.12.0`. npm only warns, so it failed later and
#      less obviously.
#   2. The builder wrote to `<repo>/dist-electron` (its `directories.output`
#      was `../dist-electron`, relative to `electron/`) while every path below
#      looked in `electron/dist-electron`. The output directory is now
#      `dist-electron` inside `electron/`, which is where these paths already
#      pointed.
#   3. The artifact verification compared real filenames against glob patterns,
#      and `-join` binds tighter than `-ne`, so the whole expression evaluated
#      to the *string* "True" -- always truthy. The step could never pass.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: >-
          Publish a GitHub Release from this build. Leave false unless the
          release checklist in docs/RELEASING.md has been completed.
        type: boolean
        default: false
      release_title:
        description: >-
          Title of the GitHub Release, for example "NANO 0.4.0-beta.1 (Beta 4)".
          Empty: "NANO <version>".
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 3.12, not 3.12.10: ubuntu-latest moved to Ubuntu 26.04, which has no
      # 3.12.10 build, and the release run for 0.3.0-beta.1 stopped here.
      # ci.yml already uses '3.12' on Linux. The Windows build below keeps the
      # exact 3.12.10 that the embedded runtime is made from.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The same hashed locks as ci.yml and the embedded runtime below; see
      # docs/DEPENDENCIES.md for why build.lock is installed first.
      - run: python -m pip install --require-hashes -r requirements/build.lock
      - run: python -m pip install --require-hashes --no-build-isolation -r requirements/test.lock
      - run: pytest -q

  build:
    needs: test
    runs-on: windows-latest
    # Read only. Packaging never needs to write to the repository; publishing
    # does, and it now lives in its own job below so that the token used while
    # running electron-builder and a downloaded toolchain cannot write here.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python (build host)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'

      # NODE 22, NOT 20. electron@44 and its install chain
      # (@electron/get, @electron-internal/extract-zip) declare
      # `engines: node >= 22.12.0`, matching the electron job in ci.yml.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Must precede packaging: `frontend/out` is copied in as an extraResource,
      # and it embeds version.json at build time. electron/scripts/verify-package-inputs.js
      # fails the build if this export is missing or stale.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Verify requested release version
        if: inputs.publish_release
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).product
          if ($env:GITHUB_REF -ne "refs/tags/v$version" -and $env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Publishing requires main or the exact tag from version.json.'
          }

      # NO `npm run fetch-electron` HERE, DELIBERATELY. Electron 42 stopped
      # downloading its binary during `npm ci`, which is why ci.yml's
      # chromium-ui job fetches it explicitly -- that job *runs* Electron.
      # Packaging does not: electron-builder resolves the version from
      # node_modules/electron/package.json and downloads its own dist zip
      # through @electron/get. Adding the fetch here would download ~100 MB
      # that nothing reads.

      - name: Prepare relocatable embedded Python runtime
        shell: pwsh
        run: ./scripts/prepare_windows_runtime.ps1

      - name: Validate plugin source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pluginFiles = Get-ChildItem -Path plugins -Filter '*.py' -Recurse -File
          if (-not $pluginFiles) { throw 'No Python plugin files found.' }
          foreach ($plugin in $pluginFiles) {
            python -m py_compile $plugin.FullName
            if ($LASTEXITCODE -ne 0) { throw "Plugin syntax check failed: $($plugin.FullName)" }
          }
          Write-Host "Nano plugin syntax validation OK ($($pluginFiles.Count) files)"

      # `prebuild:all` runs electron/scripts/verify-package-inputs.js first, so a
      # missing runtime, a stale frontend export or a stray secret stops the
      # build here rather than shipping.
      - name: Build installers
        working-directory: electron
        run: npm run build:all

      - name: Inspect packaged resources and shell archive
        working-directory: electron
        run: node scripts/verify-built-package.js

      - name: Verify installer artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = 'electron/dist-electron'
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).product
          $expected = @(
            "Nano-Setup-$version-x64.exe"
            "Nano-Setup-$version-x64.msi"
          )
          foreach ($name in $expected) {
            $file = Join-Path $outDir $name
            if (-not (Test-Path $file)) {
              $found = (Get-ChildItem $outDir -File | ForEach-Object { $_.Name }) -join ', '
              throw "Expected artifact '$name' was not produced. Found: $found"
            }
            $length = (Get-Item $file).Length
            # A Nano installer carries Electron, Chromium and an embedded
            # CPython. Anything under 50 MB means a resource silently went
            # missing, which is precisely the failure this catches.
            if ($length -lt 50MB) {
              throw "Artifact '$name' is only $length bytes; a complete installer is far larger."
            }
            Write-Host ("Installer artifact OK: {0} ({1:N1} MB)" -f $name, ($length / 1MB))
          }

      # docs/RELEASING.md tells users to verify a download against these, so
      # they have to actually exist. They did not before this pass.
      #
      # ONLY THE PUBLISHED ARTIFACT IS CHECKSUMMED. The MSI is built and
      # verified above but not attached to the release (see the publish job),
      # and a SHA256SUMS.txt listing a file nobody can download makes
      # `sha256sum -c` fail on a correct download.
      - name: Generate checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location electron/dist-electron
          $lines = Get-ChildItem -File -Include '*.exe' -Path * |
            Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          if (-not $lines) { throw 'No installers to checksum.' }
          # ASCII, LF-terminated: the format `sha256sum -c` expects.
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) 'SHA256SUMS.txt'),
            (($lines -join "`n") + "`n"),
            [System.Text.Encoding]::ASCII)
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: Nano-Windows
          path: |
            electron/dist-electron/*.exe
            electron/dist-electron/*.msi
            electron/dist-electron/SHA256SUMS.txt
          if-no-files-found: error

  # Publishing is the only thing that needs write access, so it is the only job
  # that holds it, and it downloads what `build` produced rather than assuming
  # a working directory it never ran in still exists.
  publish:
    needs: build
    if: inputs.publish_release && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          name: Nano-Windows
          path: installers

      # The release text is docs/RELEASE_NOTES_<version>.md from the tagged
      # commit, so what users read is reviewed with the code it describes.
      - name: Checkout the release notes
        uses: actions/checkout@v7
        with:
          path: notes
          sparse-checkout: |
            docs
            version.json
          sparse-checkout-cone-mode: false

      - name: Release title and notes
        id: text
        env:
          TITLE: ${{ inputs.release_title }}
        run: |
          version=$(jq -r .product notes/version.json)
          tag="v${version}"
          if [ "${GITHUB_REF}" != "refs/heads/main" ] && [ "${GITHUB_REF}" != "refs/tags/${tag}" ]; then
            echo "::error::version.json says ${version} but this run is on ${GITHUB_REF}."; exit 1
          fi
          if [ "${GITHUB_REF}" = "refs/heads/main" ] && \
             git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}" "refs/tags/${tag}" > /dev/null; then
            echo "::error::Tag ${tag} already exists: bump version.json or run this workflow on the tag."; exit 1
          fi
          notes="notes/docs/RELEASE_NOTES_${version}.md"
          test -f "$notes" || { echo "::error::$notes is missing: write the release notes first."; exit 1; }
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE:-NANO $version}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        # The only third-party action in this repository, and it runs in the
        # only job that holds `contents: write`. A mutable `@v2` tag can be
        # repointed at any commit by whoever controls that tag, so this one is
        # pinned to an immutable SHA instead of a name. The `actions/*` steps
        # above stay on major tags on purpose: they are GitHub's own, published
        # from the same trust boundary as the runner itself. Dependabot's
        # github-actions updates keep this pin current and name the version it
        # is moving to in the pull request.
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.text.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.text.outputs.title }}
          body_path: ${{ steps.text.outputs.notes }}
          prerelease: true
          fail_on_unmatched_files: true
          # NSIS ONLY, DELIBERATELY. The MSI is produced and verified by the
          # build job, and it is kept in the workflow artifact, but it is not
          # attached to a public release until a full managed-installer
          # lifecycle -- install, launch, upgrade, uninstall -- has actually
          # been run. Publishing it beside the tested NSIS path would present
          # two installers as equivalent when only one of them has been
          # exercised end to end.
          files: |
            installers/*.exe
            installers/SHA256SUMS.txt

      # AUTOMATIC UPDATES. Installed copies of NANO read one small signed file,
      # nano-update.json, from the rolling `desktop-update` pre-release, and
      # install the version it names (electron/lib/updater.js). It is signed
      # with NANO_UPDATE_SIGNING_KEY and only after the installer above is
      # public, so the feed never points at a file that is not there yet.
      # Without the secret, the release is published without a feed and
      # nobody is offered it automatically -- never a failed release.
      - name: Checkout the feed signer
        uses: actions/checkout@v7
        with:
          path: src
          sparse-checkout: |
            scripts/update_feed.mjs
            electron/lib
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Sign the update feed
        id: feed
        env:
          NANO_UPDATE_SIGNING_KEY: ${{ secrets.NANO_UPDATE_SIGNING_KEY }}
        run: |
          version="${{ steps.text.outputs.version }}"
          tag="${{ steps.text.outputs.tag }}"
          set +e
          node src/scripts/update_feed.mjs sign --product nano-desktop --channel beta \
            --version "$version" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/Nano-Setup-${version}-x64.exe" \
            --notes "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" \
            --file "installers/Nano-Setup-${version}-x64.exe" --out nano-update.json
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "::warning::NANO_UPDATE_SIGNING_KEY is not set: this release is not offered as an automatic update. See docs/UPDATES.md."
            echo "made=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "0" ]; then
            echo "made=true" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Publish the update feed
        if: steps.feed.outputs.made == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view desktop-update > /dev/null 2>&1; then
            gh release create desktop-update --prerelease --target "${GITHUB_SHA}" \
              --title "NANO desktop update feed" \
              --notes "Not a download. Installed copies of NANO read nano-update.json here to find the newest Beta. The installers are on each version's own release."
          fi
          gh release upload desktop-update nano-update.json --clobber
