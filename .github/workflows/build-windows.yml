name: Build HELIOS Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-test.txt
      - run: pytest -q

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Export frontend
        working-directory: frontend
        run: npm run build

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Prepare embedded Python runtime
        shell: pwsh
        run: |
          python -m venv runtime\python
          runtime\python\Scripts\python.exe -m pip install --upgrade pip
          runtime\python\Scripts\python.exe -m pip install -r requirements.txt
          runtime\python\Scripts\python.exe -c "import eel, httpx, groq, psutil, yaml; print('HELIOS runtime OK')"

      - name: Build installers
        working-directory: electron
        run: npm run build:all

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: HELIOS-Windows
          path: dist-electron/*.{exe,msi}
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/*.exe
            dist-electron/*.msi
