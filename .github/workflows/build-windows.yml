name: Build Nano Windows (manual)

# This workflow produces beta installers for manual validation. Publishing
# requires an explicit input and a matching version tag; pushes never publish.
#
# It used to run on every push to main and to publish a GitHub Release on any
# `v*` tag. Neither is appropriate yet:
#
#   * Nano has never had a public release. Installers are unsigned, there is no
#     updater, and a clean Windows validation remains a release requirement.
#   * Building an installer on every push spends Windows runner minutes -- the
#     most expensive kind -- to produce something nobody may download.
#   * A release published from a tag is irreversible in practice. Until the
#     release process in docs/RELEASING.md is agreed, nothing should be able to
#     publish by accident.
#
# So the triggers are `workflow_dispatch` only. Ordinary CI lives in ci.yml.
#
# WHAT THE PACKAGING PASS CHANGED HERE. Three things made this workflow unable
# to produce an artifact at all, and none of them could be seen by reading it:
#
#   1. Node 20, while electron@44 and its whole install chain declare
#      `engines: node >= 22.12.0`. npm only warns, so it failed later and
#      less obviously.
#   2. The builder wrote to `<repo>/dist-electron` (its `directories.output`
#      was `../dist-electron`, relative to `electron/`) while every path below
#      looked in `electron/dist-electron`. The output directory is now
#      `dist-electron` inside `electron/`, which is where these paths already
#      pointed.
#   3. The artifact verification compared real filenames against glob patterns,
#      and `-join` binds tighter than `-ne`, so the whole expression evaluated
#      to the *string* "True" -- always truthy. The step could never pass.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: >-
          Publish a GitHub Release from this build. Leave false unless the
          release checklist in docs/RELEASING.md has been completed.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-test.txt
      - run: pytest -q

  build:
    needs: test
    runs-on: windows-latest
    # Read only. Packaging never needs to write to the repository; publishing
    # does, and it now lives in its own job below so that the token used while
    # running electron-builder and a downloaded toolchain cannot write here.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (build host)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      # NODE 22, NOT 20. electron@44 and its install chain
      # (@electron/get, @electron-internal/extract-zip) declare
      # `engines: node >= 22.12.0`, matching the electron job in ci.yml.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Must precede packaging: `frontend/out` is copied in as an extraResource,
      # and it embeds version.json at build time. electron/scripts/verify-package-inputs.js
      # fails the build if this export is missing or stale.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Verify requested release version
        if: inputs.publish_release
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).product
          if ($env:GITHUB_REF -ne "refs/tags/v$version") {
            throw 'Publishing requires the exact tag from version.json.'
          }

      # NO `npm run fetch-electron` HERE, DELIBERATELY. Electron 42 stopped
      # downloading its binary during `npm ci`, which is why ci.yml's
      # chromium-ui job fetches it explicitly -- that job *runs* Electron.
      # Packaging does not: electron-builder resolves the version from
      # node_modules/electron/package.json and downloads its own dist zip
      # through @electron/get. Adding the fetch here would download ~100 MB
      # that nothing reads.

      - name: Prepare relocatable embedded Python runtime
        shell: pwsh
        run: ./scripts/prepare_windows_runtime.ps1

      - name: Validate plugin source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pluginFiles = Get-ChildItem -Path plugins -Filter '*.py' -Recurse -File
          if (-not $pluginFiles) { throw 'No Python plugin files found.' }
          foreach ($plugin in $pluginFiles) {
            python -m py_compile $plugin.FullName
            if ($LASTEXITCODE -ne 0) { throw "Plugin syntax check failed: $($plugin.FullName)" }
          }
          Write-Host "Nano plugin syntax validation OK ($($pluginFiles.Count) files)"

      # `prebuild:all` runs electron/scripts/verify-package-inputs.js first, so a
      # missing runtime, a stale frontend export or a stray secret stops the
      # build here rather than shipping.
      - name: Build installers
        working-directory: electron
        run: npm run build:all

      - name: Inspect packaged resources and shell archive
        working-directory: electron
        run: node scripts/verify-built-package.js

      - name: Verify installer artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = 'electron/dist-electron'
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).product
          $expected = @(
            "Nano-Setup-$version-x64.exe"
            "Nano-Setup-$version-x64.msi"
          )
          foreach ($name in $expected) {
            $file = Join-Path $outDir $name
            if (-not (Test-Path $file)) {
              $found = (Get-ChildItem $outDir -File | ForEach-Object { $_.Name }) -join ', '
              throw "Expected artifact '$name' was not produced. Found: $found"
            }
            $length = (Get-Item $file).Length
            # A Nano installer carries Electron, Chromium and an embedded
            # CPython. Anything under 50 MB means a resource silently went
            # missing, which is precisely the failure this catches.
            if ($length -lt 50MB) {
              throw "Artifact '$name' is only $length bytes; a complete installer is far larger."
            }
            Write-Host ("Installer artifact OK: {0} ({1:N1} MB)" -f $name, ($length / 1MB))
          }

      # docs/RELEASING.md tells users to verify a download against these, so
      # they have to actually exist. They did not before this pass.
      - name: Generate checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location electron/dist-electron
          $lines = Get-ChildItem -File -Include '*.exe','*.msi' -Path * |
            Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          if (-not $lines) { throw 'No installers to checksum.' }
          # ASCII, LF-terminated: the format `sha256sum -c` expects.
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) 'SHA256SUMS.txt'),
            (($lines -join "`n") + "`n"),
            [System.Text.Encoding]::ASCII)
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Nano-Windows
          path: |
            electron/dist-electron/*.exe
            electron/dist-electron/*.msi
            electron/dist-electron/SHA256SUMS.txt
          if-no-files-found: error

  # Publishing is the only thing that needs write access, so it is the only job
  # that holds it, and it downloads what `build` produced rather than assuming
  # a working directory it never ran in still exists.
  publish:
    needs: build
    if: inputs.publish_release && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: Nano-Windows
          path: installers

      - name: Publish GitHub release
        # The only third-party action in this repository, and it runs in the
        # only job that holds `contents: write`. A mutable `@v2` tag can be
        # repointed at any commit by whoever controls that tag, so this one is
        # pinned to an immutable SHA instead of a name. The `actions/*` steps
        # above stay on major tags on purpose: they are GitHub's own, published
        # from the same trust boundary as the runner itself. Dependabot's
        # github-actions updates keep this pin current and name the version it
        # is moving to in the pull request.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            installers/*.exe
            installers/*.msi
            installers/SHA256SUMS.txt
