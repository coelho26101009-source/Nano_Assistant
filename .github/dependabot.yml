# Dependabot version updates.
#
# Nano is a desktop assistant that holds an API key and can act on the user's
# machine, so a stale transitive dependency is a real exposure rather than a
# tidiness problem. This file covers the dependency roots the repository
# actually has, plus the phone app added in November 2026:
#
#   /            requirements*.txt (the manifests; hashed locks in requirements/)
#   /frontend    the Next.js renderer
#   /electron    the desktop shell and its build tooling
#   /mobile      the Android app (Capacitor + React + Vite)
#   /            .github/workflows/*.yml
#
# The Android Gradle files are generated and pinned by Capacitor
# (mobile/android/variables.gradle); they move with a Capacitor update, so
# there is no gradle entry.
#
# There is no pyproject.toml and no root package.json; adding entries for them
# would produce "manifest not found" noise rather than updates.
#
# Everything here is deliberately MONTHLY and GROUPED, and majors are ignored. This is a single-maintainer
# repository: an ungrouped daily schedule across four ecosystems would open more
# pull requests than one person can review, and unreviewed dependency PRs are
# worse than none. Security updates are NOT configured here -- they are enabled
# at the repository level and are not rate-limited by these settings, so a real
# advisory still gets its own pull request immediately.
#
# Dependabot pull requests run the full CI workflow: none of Nano's checks
# require a secret, so they pass or fail on the same evidence as any other PR.
version: 2

updates:
  # ------------------------------------------------------------- GitHub Actions
  # Keeps the `actions/*` major tags current and moves the SHA-pinned
  # third-party action in build-windows.yml to a new commit when it is released,
  # naming the version it is moving to in the pull request body. Without this,
  # a SHA pin becomes a way of freezing a known-old action forever.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"

  # -------------------------------------------------------------------- Python
  # The backend, the test suite and the optional extras all live in
  # requirements*.txt at the repository root. Those are the human-maintained
  # manifests, and they are all this entry updates. Every install reads the
  # hashed locks in requirements/*.lock instead, which
  # scripts/lock_python_deps.py generates from the manifests; Dependabot does
  # not regenerate them, so its Python pull requests fail the "Python
  # dependency locks" CI job until someone does (docs/DEPENDENCIES.md).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # The manifests hold ranges (eel>=0.18,<1) and the hashed locks pick the
    # exact version, so only touch a range when a new release falls outside it.
    # Raising a floor inside the range is noise, and fails the lock drift check.
    versioning-strategy: increase-if-necessary
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch
    # Major versions are upgrades, not maintenance: they are done on purpose,
    # in a normal piece of work with the full test run, never by a bot PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # uv is pinned on purpose to a release older than the lock anchor in
      # scripts/lock_python_deps.py; it moves together with that anchor.
      - dependency-name: "uv"

  # ------------------------------------------------------------------ frontend
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Major versions are upgrades, not maintenance: they are done on purpose,
    # in a normal piece of work with the full test run, never by a bot PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # React and ReactDOM are one runtime and must move together, majors
      # included. Ungrouped, the React 19 major arrived as two pull requests --
      # react, then react-dom -- and each failed `npm ci` on the other's peer
      # range, so neither could ever pass CI. Listed first, because a
      # dependency joins the first group it matches.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      frontend-minor-and-patch:
        update-types:
          - minor
          - patch

  # ------------------------------------------------------------------ electron
  # Electron itself is intentionally NOT grouped with the rest: an Electron major
  # changes the Chromium the shipped UI runs in, and the chromium-ui job is the
  # only thing that would catch a regression from it.
  - package-ecosystem: npm
    directory: /electron
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Major versions are upgrades, not maintenance: they are done on purpose,
    # in a normal piece of work with the full test run, never by a bot PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      electron-tooling-minor-and-patch:
        exclude-patterns:
          - electron
        update-types:
          - minor
          - patch

  # -------------------------------------------------------------------- mobile
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Major versions are upgrades, not maintenance: they are done on purpose,
    # in a normal piece of work with the full test run, never by a bot PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Capacitor's core, CLI, Android runtime and plugins are one platform and
      # must move together, or `cap sync` mixes versions in the Android build.
      capacitor:
        patterns:
          - "@capacitor/*"
          - "@capacitor-community/*"
          - "@capacitor-mlkit/*"
          - "@aparajita/capacitor-*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      mobile-minor-and-patch:
        update-types:
          - minor
          - patch
